# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# LibreLinux distributes no prebuilt binaries of its own. The daemon, the
# prompter and the PKCS#11 module are compiled from the tag's sources by
# distribution packaging (packaging/{arch,debian,rpm}); the Arch recipe fetches
# the source tarball THIS workflow uploads — not the one GitHub generates for
# the tag, whose bytes the project does not produce and therefore cannot
# checksum. So this workflow uploads that tarball and its cosign keyless
# signature bundle. A release here needs three things: proof that the tag
# carries the project signature, curated notes taken from CHANGELOG.md, and the
# signed source tarball packaging will fetch.
#
# The workflow deliberately performs NO build. Besides keeping it cheap, that
# is what keeps tagging independent of the agent core: a source build resolves
# LibreAgent through cmake/FindOrUseLibreAgent.cmake, which follows the agent's
# trunk, so a build step here would make publishing this component depend on
# what the agent happens to have published at that moment. The publish order
# (agent first, this component after) is a property of the release sequence and
# is not something this workflow can assert — so it asserts nothing about it
# and never fetches the agent.

on:
  push:
    tags:
      # Same shape as the sibling components: no tag in this stack carries a
      # v prefix. The second spelling was accepted only because
      # packaging/arch/PKGBUILD asked for `refs/tags/v$pkgver`; the recipe now
      # fetches the release asset this workflow uploads, and
      # packaging/arch/check-recipe.sh refuses a prefixed spelling outright, so
      # nothing is left for the second pattern to serve.
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Rehearsal path. A maintainer can start this workflow from the Actions tab
  # against an existing signed tag (Run workflow -> pick the tag as the ref) to
  # exercise the whole chain, release notes included, without pushing a fresh
  # tag. github.ref_name is the tag name on that path too, so every step below
  # behaves exactly as it does on a tag push; started against a branch instead,
  # the signature check fails closed, which is the intended outcome.
  workflow_dispatch:

# One run per tag at a time: a re-run racing a still-live earlier run would
# hand gh release create an already-existing release and fail at the last step.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-signature:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The release key's PRIMARY fingerprint, named once so the import check
      # and the signature check cannot pin different keys across a rotation.
      EXPECTED_FPR: '6B05889AC9A6A7188DF639B06F27A989C2031D16'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Import LibreSCRS release public key
        run: |
          # The published project key travels with the repository, as in the
          # sibling components. Report its absence in terms of what to do
          # about it rather than letting gpg fail with a bare open error.
          if [ ! -f KEYS ]; then
            echo "::error::KEYS is missing from the repository root — a release tag cannot be verified without the published LibreSCRS release public key"
            exit 1
          fi
          gpg --import KEYS
          gpg --list-keys --with-colons "$EXPECTED_FPR" | grep -q "^pub" \
            || { echo "::error::Public key import failed or fingerprint mismatch"; exit 1; }

      - name: Verify tag signature
        # verify-tag alone accepts a good signature by ANY key in the keyring,
        # so the signer is pinned by fingerprint through --raw's VALIDSIG line.
        #
        # Field order is the whole trick here. VALIDSIG's FIRST field is the
        # fingerprint of the key that physically signed, and this project signs
        # with a subkey (the primary is certify-only, `cSC`), so the first field
        # is the SUBKEY. The primary — the identity worth pinning, because it
        # outlives every subkey rotation — is VALIDSIG's LAST field. Matching
        # the primary right after "VALIDSIG" therefore rejects every genuinely
        # signed tag, and pinning the subkey instead would break at the next
        # rotation; match the primary in the trailing position.
        #
        # Anchored, and deliberately not a bare fingerprint grep: gpg also
        # emits KEY_CONSIDERED with the primary's fingerprint, and it does so
        # even for a BADSIG, so a loose match would accept a forged tag.
        #
        # The ref name moves through the environment, never inline into the
        # script — a git ref may carry shell metacharacters and the tag
        # filter's trailing * accepts an arbitrary suffix.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git verify-tag --raw "$TAG" 2>&1 \
            | grep -qE "^\[GNUPG:\] VALIDSIG [0-9A-F]{40} .* ${EXPECTED_FPR}\$" \
            || { echo "::error::Tag $TAG is not signed by the LibreSCRS release key"; exit 1; }

  source-tarball:
    # The source tarball is produced by this project, not by GitHub. GitHub's
    # archive/refs/tags tarball omits every submodule tree and its bytes are
    # not ours to assert; this one comes from a clone with --recurse-submodules
    # and is byte-identical run to run -- ci/scripts/check-tarball-determinism.sh
    # measures that on every push, up to the gzip implementation, which is the
    # one thing the script cannot make a property of the commit -- so the
    # sha256sums line in packaging/arch/PKGBUILD becomes a claim about bytes
    # this project made.
    #
    # It runs after the signature check for the same reason every other job
    # does: nothing is built for a tag whose signature has not been proved.
    timeout-minutes: 20
    needs: verify-signature
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build the source tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/srctar"
          ci/scripts/make-source-tarball.sh "$RUNNER_TEMP/srctar"
          ls -l "$RUNNER_TEMP/srctar"

      - uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: ${{ runner.temp }}/srctar/*.orig.tar.gz
          # An empty upload here would make the release job publish a release
          # with no source at all, and the recipe's source= URL would 404 for
          # everyone. Fail where it is cheap.
          if-no-files-found: error

  release:
    timeout-minutes: 15
    needs: [verify-signature, source-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci/release-assets.txt
            ci/scripts/check-release-assets.sh
            CHANGELOG.md
            VERSION
            ci/scripts/check-release-lockstep.sh
            cmake/libreagent.pin
          sparse-checkout-cone-mode: false

      - name: Fetch the source tarball this release publishes
        uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: dist


      - name: Install cosign
        # By commit, not by tag: this job mints a Sigstore identity for the
        # project, and a moved tag on a third-party action would run its code
        # here. A pin nobody maintains goes stale; move it deliberately.
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # v4.0.0

      - name: Sign the source tarball with cosign (keyless via Sigstore OIDC)
        # The packaging recipe fetches this tarball and its checksum is SKIP
        # until the tag exists, so the signature is the only integrity claim
        # it carries.
        run: |
          find dist -type f ! -name '*.sigstore.json' \
            -exec sh -c 'cosign sign-blob "$1" --bundle "$1.sigstore.json" --yes' _ {} \;
      - name: The agent pin is the agent's tag
        # The consumers pin the agent by commit so a build cannot drift onto
        # whatever the agent's branch holds that hour. At release time that pin
        # must be the commit the agent's own tag of the SAME version points at,
        # or this component ships built against something the agent never
        # published.
        #
        # The lookup dereferences. For an annotated tag the ref endpoint returns
        # the SHA of the TAG OBJECT, not of the commit, so comparing the two
        # directly would fail on every correctly signed tag — the same class of
        # mistake as reading VALIDSIG's fields in the wrong order.
        env:
          VER: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The `on:` filter above no longer accepts a v-prefixed tag, but the
          # rehearsal path does: workflow_dispatch runs against whatever ref it
          # is pointed at, filter or no filter. The agent publishes unprefixed
          # tags only, so strip it here the way the notes step below already
          # does, or a v5.0.0 rehearsal asks the agent for a tag that cannot
          # exist and fails looking like a pin that was never bumped.
          VER="${VER#v}"
          pin=$(tr -d '[:space:]' < cmake/libreagent.pin)
          tagsha=$(gh api repos/LibreSCRS/LibreAgent/git/ref/tags/"$VER" --jq '.object.sha')
          type=$(gh api repos/LibreSCRS/LibreAgent/git/ref/tags/"$VER" --jq '.object.type')
          if [ "$type" = "tag" ]; then
            tagsha=$(gh api repos/LibreSCRS/LibreAgent/git/tags/"$tagsha" --jq '.object.sha')
          fi
          [ "$pin" = "$tagsha" ] || {
            echo "::error::agent pin is not the agent's $VER tag (pin $pin, tag $tagsha)"
            exit 1
          }

      - name: Prepare release notes from CHANGELOG
        # One extractor, in ci/scripts/check-release-lockstep.sh, shared with
        # the per-push agreement check. It used to be copied inline into every
        # release workflow, and one of the copies had drifted: without escaping
        # the version's dots, tag 5.0.0 also matched a [500.0] heading.
        #
        # --section exits non-zero when the section is missing OR holds only
        # whitespace. Both have to fall back: `gh release create --notes-file`
        # accepts a blank file and publishes a release with no body at all.
        # --generate-notes and --notes-file are mutually exclusive, hence the
        # shell branch.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if ci/scripts/check-release-lockstep.sh --section "$VER" > "$RUNNER_TEMP/relnotes.md"; then
            echo "NOTES_ARG=--notes-file $RUNNER_TEMP/relnotes.md" >> "$GITHUB_ENV"
          else
            echo "No CHANGELOG section for $VER — falling back to --generate-notes"
            echo "NOTES_ARG=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: The staged asset set is the set this repository declares
        # The files gh is about to publish, against ci/release-assets.txt, in
        # both directions, before the release exists.
        run: ci/scripts/check-release-assets.sh --staged dist

      - name: Create GitHub release
        # The ref name and repository move through the environment, never
        # inline into the script — a git ref may carry shell metacharacters
        # and the tag filter's trailing * accepts an arbitrary suffix.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Mark X.Y.Z-{rc,beta,alpha,…} as pre-release; everything else stable.
          PRERELEASE_FLAG=""
          case "$TAG" in
              *-rc*|*-beta*|*-alpha*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # NOTES_ARG must split into two argv entries and PRERELEASE_FLAG
          # must disappear when empty — deliberately unquoted.
          # shellcheck disable=SC2086
          gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --verify-tag \
              $NOTES_ARG \
              $PRERELEASE_FLAG \
              dist/*

      - name: The published release is the set this repository declares
        # The release this job just created, read back. A draft is judged too,
        # and the check prints DRAFT=yes so the log is not taken for evidence
        # about a published release.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: ci/scripts/check-release-assets.sh --published "$TAG"
