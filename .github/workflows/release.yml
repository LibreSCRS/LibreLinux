# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# What a release of LibreLinux publishes: the agent and the prompter as .deb
# and .rpm packages for every distribution the stack supports, the
# deterministic source tarball, a bill of materials for what the agent binary
# bundles, SHA256SUMS, and a cosign bundle per file.
#
#   preflight  everything a release can be refused for, before anything is
#              built or signed: the mode against the ref, the tag's signature
#              (on a branch: the verifier proved both ways on fixtures), every
#              version surface against the release, and deps.lock (on a tag:
#              every upstream row is that upstream's tag of the same version).
#   build      source tarball + bill of materials; packages per distribution.
#              On a tag the upstream packages are downloaded from the upstream
#              releases, which the release order publishes first; in a
#              rehearsal they are built from the commits deps.lock names.
#   seal       SHA256SUMS, signatures, and their verification (on a tag:
#              keyless and a provenance attestation; in a rehearsal: an
#              ephemeral key, and the keyless path proved on fixtures).
#   publish    the release (tag), or a workflow artefact (rehearsal).
#
# mode=rehearse runs on any ref and publishes nothing; mode=publish only on a
# tag. A tag push publishes. A branch push that touches something a package is
# made of -- the recipes, the build, the install rules, the locked upstreams --
# rehearses, so the packages are built and judged on one path only, this one;
# a push that touches none of it builds no package.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    branches: [main, 'ci/**']
    # Not evaluated for tag pushes, which always run.
    paths:
      - 'packaging/**'
      - 'deps.lock'
      - 'VERSION'
      - 'CHANGELOG.md'
      - '**/CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearse (any ref) or publish (a tag ref only)'
        type: choice
        options: [rehearse, publish]
        default: rehearse

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      version: ${{ steps.pre.outputs.version }}
      is_prerelease: ${{ steps.pre.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pre
        uses: LibreSCRS/ci/actions/release-preflight@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          mode: ${{ inputs.mode || (github.ref_type == 'tag' && 'publish' || 'rehearse') }}
          version-min: '1'

  source-tarball:
    # The source tarball is produced by this project, not by GitHub, and is a
    # function of the commit. The bill of materials names what the agent
    # binary bundles, read from the locked agent checkout.
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: ac199ae69bc187a8571c9f29763503c1a966ea2c
          path: .ci
          persist-credentials: false
      - name: Deterministic source tarball
        run: .ci/scripts/make-source-tarball --name librelinux --out out
      - name: Checkout LibreAgent at the lock
        id: deps
        uses: LibreSCRS/ci/actions/checkout-deps@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          names: LibreAgent
      - name: Bill of materials
        env:
          LA_SRC: ${{ steps.deps.outputs.libreagent-path }}
        run: |
          .ci/scripts/make-sbom --out out/sbom.cdx.json \
            --static-dep "LibreAgent=$LA_SRC" --require libreagent --require qcbor
          .ci/scripts/check-sbom out/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tarball-artifacts
          path: out/*
          if-no-files-found: error
          retention-days: 3

  packages:
    name: packages (${{ matrix.slug }})
    needs: [preflight]
    runs-on: ubuntu-24.04
    # Measured locally at -j4: middleware 7-9 min, agent libraries 7-9, this
    # repository 3-4 per distribution, then 2-4 to verify; on a tag the
    # upstream packages are downloaded instead of built.
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slug: [debian13, ubuntu2604, fedora43, fedora44, opensusetw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build
        id: build
        uses: LibreSCRS/ci/actions/pkg-build@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          slug: ${{ matrix.slug }}
          upstream: ${{ github.ref_type == 'tag' && 'release' || 'source' }}
          version: ${{ github.ref_type == 'tag' && needs.preflight.outputs.version || '' }}
      - name: Install and judge the stack
        uses: LibreSCRS/ci/actions/pkg-verify@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          slug: ${{ matrix.slug }}
          packages: ${{ steps.build.outputs.art }}/${{ matrix.slug }}
          report: ${{ runner.temp }}/pkg-report
          hook: packaging/ci/verify-installed.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ steps.build.outputs.dist }}
          if-no-files-found: error
          retention-days: 3

  seal:
    needs: [preflight, source-tarball, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: artifacts
      # The package names already carry the distribution, and the collector
      # refused any clash when it named them, so merging cannot overwrite.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: 'packages-*'
          merge-multiple: true
          path: artifacts
      - uses: LibreSCRS/ci/actions/release-seal@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sealed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [preflight, seal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sealed
          path: artifacts
      - uses: LibreSCRS/ci/actions/release-publish@ac199ae69bc187a8571c9f29763503c1a966ea2c
        with:
          mode: ${{ needs.preflight.outputs.mode }}
          version: ${{ needs.preflight.outputs.version }}
          is_prerelease: ${{ needs.preflight.outputs.is_prerelease }}
