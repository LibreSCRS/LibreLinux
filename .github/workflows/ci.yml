# SPDX-License-Identifier: LGPL-2.1-or-later
name: CI

# The job that builds LibreLinux first acquires LibreMiddleware exactly as
# LibreCelik's CI expects it: built from source against the public org repo
# and installed to a prefix, because LibreLinux consumes it via
# `find_package(LibreMiddleware 5.0 REQUIRED CONFIG)` (CMakeLists.txt) — there
# is no FetchContent fallback here, so the package must exist on disk first.
# The revision is the one deps.lock names, never a branch.
#
# The shared gates (format scope, skip reasons, workflow shape, the build-log
# and test-set gates, the lock checks) come from LibreSCRS/ci, all at one
# commit; profiles/LibreLinux.txt there says which ones this repository runs
# in which phase.

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

  # Manual runs: a branch that is not a pull request otherwise gets no run
  # when nothing is pushed to it.
  workflow_dispatch:

permissions: {}

jobs:
  format-check:
    # Self-contained: the format gate needs neither LibreMiddleware nor the
    # KF6/sdbus-c++ runtime deps, so it runs on Ubuntu with the exact
    # clang-format-21 the rest of the org pins (apt.llvm.org). The build/test
    # job below runs in an Arch container instead, because Arch's rolling
    # `clang` package is ahead of 21 and would reformat against a different
    # major — the project standard is clang-format 21, not the distro default.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # fetch-tags, deliberately: the stamp arm of the version check reads the
      # newest tag, and a tagless checkout would only ever show it one side.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Check clang-format
        # The roots live in ci/format-dirs.txt, which the shared scope check
        # reads too: a directory nobody formats cannot appear without one of
        # these two steps saying so.
        #
        # -print0/-0 for paths with spaces, a parenthesised extension filter so
        # the -o cannot swallow the directory list, and -r because without it an
        # empty result makes clang-format read stdin and hang rather than fail.
        # A wedged job in this project once held a runner until it was cancelled by hand.
        run: |
          mapfile -t dirs < <(grep -v '^#' ci/format-dirs.txt)
          find "${dirs[@]}" \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name '*.mm' \) -print0 \
            | xargs -0 -r clang-format-21 --dry-run --Werror

      # Format scope, skip reasons, the workflows as data (every gate reached,
      # every job bounded, every step placed where it can run, one pin of the
      # shared gates), the canonical-type registry, duplicate bodies, this
      # repository's own self-tests, and deps.lock (form, reachable from each
      # upstream's main, one revision per dependency across the stack).
      - name: Shared gates
        uses: LibreSCRS/ci/actions/gates@5b9410f9b0e6ab6983c39f931e118e68007c12b4

      - name: No signal handler outlives the state it captures
        # sdbus-c++ keeps a handler armed for as long as its proxy lives and
        # delivers it on the event-loop thread. Locals die in reverse
        # declaration order, so a proxy declared before the state its handler
        # captures is destroyed after it, and a signal arriving in that window
        # locks a destroyed mutex. The race is microseconds wide and nothing
        # can steer a signal into it on demand; the declaration order is
        # decidable from the source, so that is what this measures. Its
        # self-test runs with the others, in the shared gates above.
        run: ./ci/scripts/check-signal-state-lifetime.sh

      - name: The Arch recipe builds this project's signed tag
        # Reads the recipe as text: its one source is this repository's own
        # signed tag, the key it accepts is the one in KEYS, and pkgver is the
        # first line of VERSION. No network. The self-test runs with the others.
        run: ./packaging/arch/check-recipe.sh

      # The version and release-shape gates live in LibreSCRS/ci too, but take
      # no profile: they are the same scripts the release preflight runs with
      # the tag's version, run here on every push with the version this tree
      # is heading for, so a disagreement shows weeks before a tag that cannot
      # be taken back. Same commit as every other reference to the shared
      # gates; checked out beside this repository, after the gates above have
      # judged it.
      - name: Check out the shared gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: LibreSCRS/ci
          ref: 5b9410f9b0e6ab6983c39f931e118e68007c12b4
          path: .shared-gates
          persist-credentials: false

      - name: Every version surface states the version in VERSION
        # Four arms: the CHANGELOG has a section for VERSION (lockstep), every
        # first-party find_package floor names its major (floors), project()
        # follows VERSION until a tag of that major exists (stamp), and the
        # RPM spec agrees (surfaces). --min 1 is the vacuum guard: a floors
        # scan that matches nothing is unmeasured, not clean.
        run: .shared-gates/scripts/check-version.sh --min 1

      - name: Every release artefact has a producer and a consumer
        # needs, names and producer arms over the release workflow: a download
        # with no upstream uploader, an upload nothing downloads, and a source
        # tarball built and thrown away all fail here instead of on the tag.
        run: .shared-gates/scripts/check-release-artifacts.sh

      - name: The release checks its asset set before publishing
        run: .shared-gates/scripts/check-release-assets.sh --wired

      - name: The source tarball is a function of the commit
        # Two runs of ci/scripts/make-source-tarball.sh, forced apart by a
        # second boundary and a umask boundary, then the property read out of
        # the archive: commit timestamp, owner 0/0, closed mode set, name
        # order, nothing under .github/, top directory <Repository>-<VERSION>.
        run: .shared-gates/scripts/check-tarball-determinism.sh

  build-linux:
    # Arch container: LibreLinux's runtime deps (sdbus-c++ >= 2.0, libsystemd)
    # are not reliably packaged on ubuntu apt, and the owner's dev/target env
    # is Arch/Manjaro. pacman provides sdbus-cpp 2.x, libsystemd, pcsclite,
    # OpenSC (for LibreMiddleware), gtest, qt6/kf6 (for the prompter), and
    # dbus-run-session for the agent/prompter integration tests.
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: read
    env:
      # Where LibreMiddleware is installed and where LibreLinux finds it.
      LM_PREFIX: /opt/libremiddleware
    steps:
      - name: Install system dependencies
        id: sys
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            sdbus-cpp systemd-libs \
            openssl pcsclite opensc \
            gtest dbus \
            p11-kit \
            python-jsonschema \
            qt6-base kcoreaddons ki18n
          # What the cached middleware install was built with. A rolling image
          # moves these under a cache keyed on the source commit alone.
          echo "toolchain=$(pacman -Q gcc glibc openssl pcsclite opensc systemd-libs p11-kit | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Generate a UTF-8 locale
        # The bare Arch container ships only the C / C.UTF-8 locales, under which
        # the C library's gettext (which ki18n uses to read .mo catalogs)
        # suppresses translation entirely. PromptCatalogResolutionTest proves the
        # sr Cyrillic-primary prompter catalog resolves end-to-end and therefore
        # needs a real UTF-8 locale present; generate en_US.UTF-8 (the test's own
        # CTest properties set LANG=en_US.UTF-8 + LANGUAGE=sr). Without this a
        # broken/empty sr msgstr would ship green (the documented ki18n/gettext
        # C-locale pitfall).
        run: |
          echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
          locale-gen

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: LibreLinux
          persist-credentials: false

      # --- LibreMiddleware: build from source + install to a prefix ---------
      # LibreLinux requires the installed CONFIG package, so we build +
      # `cmake --install` it explicitly. SHARED + plugins ON because the agent
      # dlopen's the card plugins at runtime; native signing backend (the CI
      # default) — DSS is only a test oracle. At the commit deps.lock names,
      # never a branch: the action checks the locked revision out and proves
      # the checkout is that revision.
      - name: Checkout LibreMiddleware at the lock
        id: deps
        uses: LibreSCRS/ci/actions/checkout-deps@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          root: LibreLinux
          names: LibreMiddleware
          path: .
          fetch-depth: '0'
          submodules: recursive   # LM vendors OpenSC as a git submodule (thirdparty/opensc-source)

      # The install is a function of the locked commit and of the toolchain
      # that built it, so that pair is the key; a new lock or a moved compiler
      # builds it again.
      - name: Restore the LibreMiddleware install
        id: lm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/libremiddleware
          key: lm-arch-${{ steps.deps.outputs.libremiddleware-sha }}-${{ steps.sys.outputs.toolchain }}

      - name: Build & install LibreMiddleware (Release, SHARED)
        if: steps.lm-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S LibreMiddleware -B lm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build lm-build -j4
          cmake --install lm-build

      - name: Keep the LibreMiddleware install
        if: steps.lm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/libremiddleware
          key: lm-arch-${{ steps.deps.outputs.libremiddleware-sha }}-${{ steps.sys.outputs.toolchain }}

      # --- LibreLinux: configure / build (default system mode) --------------
      # NOT LIBRELINUX_USER_INSTALL — that mode targets per-user XDG dirs for
      # dogfooding. CI builds the packaging layout (system prefix), which is
      # what distro packages ship.
      - name: Configure (Release, warnings as errors)
        # LIBRELINUX_WERROR mirrors what the `release-strict` preset sets, but
        # spelled out here because that preset also pins CMAKE_PREFIX_PATH to a
        # developer's ~/.local prefix, which is not where this job installs the
        # middleware. Keep the two in step.
        #
        # The option is not only a severity switch: pkcs11-module/CMakeLists.txt
        # gives librescrs-pkcs11-agent its -Wall -Wextra inside the same
        # condition, so with it off that target is built with no warning flags
        # at all and nothing about it is checked. The three targets it covers
        # (LibreLinuxAgentCore, librescrs-pkcs11-agent, librescrs-pinentry-kde)
        # are the shipped ones; test executables keep warning-only builds.
        working-directory: LibreLinux
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBRELINUX_WERROR=ON

      - name: Build (agent + prompter)
        working-directory: LibreLinux
        run: |
          # set -o pipefail is explicit: without it `| tee` reports tee's status
          # and a failed build becomes a green step, after which the warning
          # check measures a log that was never produced.
          set -o pipefail
          LC_ALL=C cmake --build build -j4 2>&1 | tee build.log

      # The warning baseline over the log (counted by the [-Wname] tag, never
      # by the localised message; a compiler with no section in the baseline
      # FAILS, and a floor the configured graph cannot reach is named as
      # such), the discovered test set against ci/test-manifest.linux.txt,
      # and the agent sources the configure fetched against the LibreAgent row
      # of deps.lock -- the tree built, not the message the configure printed.
      #
      # Test discovery is PRE_TEST here, so listing the set runs every test
      # binary with --gtest_list_tests. The Qt ones create their application
      # object before listing, and with no display that aborts: the set has
      # to be discovered under the same platform plugin the Test step uses.
      - name: Shared gates after the build
        uses: LibreSCRS/ci/actions/gates@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        env:
          QT_QPA_PLATFORM: offscreen
        with:
          root: LibreLinux
          phase: build
          build-dir: build
          build-log: build.log
          leg: linux

      # --- e2e harness compiles ---------------------------------------------
      # The hardware-acceptance clients under e2e/ are deliberately outside the
      # CMake build: they need a card, a reader and a human's secrets, so they
      # can never run here. That is exactly why they need this step. Left
      # uncompiled they drift out of the wire contract silently — the headless
      # prompter had already stopped building against its own generated adaptor,
      # missing a method the interface had grown, and nothing reported it
      # because nothing ever compiled the file.
      #
      # This compiles them and runs nothing: no card, no secrets, no PIN.
      - name: Build the e2e harness (compile only, no card)
        working-directory: LibreLinux
        run: ./e2e/build.sh

      # --- Qt-free gate (project invariant) ---------------------------------
      # The librescrs-agent daemon MUST stay Qt-free (DE-agnostic: sdbus-c++ +
      # libsystemd only). The prompter MAY link Qt — it is the Qt-OK boundary —
      # so the gate checks only the agent binary. A Qt symbol leaking into the
      # daemon fails the build here.
      - name: Assert agent is Qt-free
        working-directory: LibreLinux
        run: |
          if ldd build/agent/librescrs-agent | grep -qi 'libqt'; then
            echo "::error::Qt linked into the librescrs-agent daemon — it MUST stay Qt-free"
            ldd build/agent/librescrs-agent | grep -i 'libqt'
            exit 1
          fi
          echo "OK: librescrs-agent does not link Qt"

      # --- Tests ------------------------------------------------------------
      # offscreen for the prompter widget tests; dbus-run-session provides a
      # private session bus the agent/prompter integration tests connect to
      # (mirrors the PKGBUILD check()). No LIBRESCRS_TEST_PIN: PIN/live-card
      # suites self-skip without a reader.
      - name: Test
        working-directory: LibreLinux
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The pipe is removed rather than patched. The runner's default shell
          # for a `run:` step is `bash -e {0}` WITHOUT pipefail, so
          # `ctest ... | tee ctest.log` reports the status of tee: a failed
          # suite showed as a green step, and a check reading that log
          # afterwards passed too. With no pipe there is no question about what
          # the default is. Measured: the old shape exits 0 on a ctest that
          # fails, this one exits 1.
          set +e
          dbus-run-session -- ctest --test-dir build --output-on-failure --no-tests=error > ctest.log 2>&1
          rc=$?
          set -e
          cat ctest.log
          echo "ctest rc=$rc"
          exit "$rc"

      # --- Address-sanitizer gate for the module's D-Bus client lifetimes ----
      # The TSan step below builds six agent targets and none from
      # pkcs11-module/. The module's D-Bus client is the one place in this
      # repository where a signal handler runs on another thread against locals
      # of a frame that may already have returned, and TSan does not model
      # stack frames. ASan does, but only with
      # detect_stack_use_after_return, which is off by default.
      #
      # Be honest about the reach of this leg: it does not reproduce the race.
      # The window is microseconds wide and the client's wait is a fixed
      # budget with no knob to shorten it, so nothing here can steer a signal
      # into it. It is a regression net for everything else this translation
      # unit does; the deterministic verdict on declaration order is the
      # source-shape gate in format-check.
      - name: ASan (pkcs11-module lifetimes)
        working-directory: LibreLinux
        env:
          # detect_leaks / detect_container_overflow off for the same reason
          # they are off wherever this project runs ASan against distribution
          # packages: GTest and sdbus-c++ come from the container uninstrumented,
          # and a container that lives inside uninstrumented code but is touched
          # from instrumented code reports an overflow that is not one, while
          # their own allocations report as leaks nothing here can free. Every
          # other check stays on, including the one this leg exists for.
          ASAN_OPTIONS: detect_stack_use_after_return=1:detect_leaks=0:detect_container_overflow=0:halt_on_error=1
        run: |
          cmake -B build-asan-p11 -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBRELINUX_BUILD_PROMPTER_KDE=OFF \
            -DLIBRELINUX_WERROR=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          cmake --build build-asan-p11 --target DBusAgentClientTest DBusAgentClientContractTest -j4
          # This step runs BEFORE the host-install step below, and that order
          # is load-bearing: once the agent's D-Bus service file is in the
          # system service directory, a session bus started here activates
          # that agent on the first call, and the contract's "no agent" case
          # meets an agent that starts and fails to load its libraries
          # (GeneralError) rather than no agent at all (DeviceRemoved). The
          # bus also runs on ci/dbus-session-isolated.conf, a configuration
          # with no service directory, as a second guard against the same
          # thing: an unowned name answers ServiceUnknown, nothing spawns.
          dbus-run-session --config-file=ci/dbus-session-isolated.conf -- \
            ctest --test-dir build-asan-p11 \
            -R "DBusAgentClient" --output-on-failure --no-tests=error

      # --- Thread-sanitizer gate for the agent concurrency invariants -------
      # The reader-map / ReaderObject-field locking (BusExporter::m_readersMutex
      # + ReaderObject::m_mutex) is a data-race guard: a regression that drops a
      # lock still passes the plain RelWithDebInfo Test step green but races
      # under TSan. Build + run only the concurrency suite under
      # -fsanitize=thread (KDE prompter OFF so no Qt; the installed LM is
      # uninstrumented, which is fine — the guarded state is LL-owned).
      - name: TSan (agent concurrency)
        working-directory: LibreLinux
        env:
          QT_QPA_PLATFORM: offscreen
          TSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBRELINUX_BUILD_PROMPTER_KDE=OFF \
            -DLIBRELINUX_WERROR=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          # One spelling of the selection, used by the build, by the run and by
          # the count below. Three copies is how one of them stops matching.
          SUITES="BusExporterReaderRace|ReaderRemoveDrain|AgentShutdownUnderLoad|TypedChannelWedgeDrain|SignSeamWedgeDrain|TransportCaptureGuard|CardObjectOperations"
          cmake --build build-tsan --target BusExporterReaderRaceTest ReaderRemoveDrainTest AgentShutdownUnderLoadTest TypedChannelWedgeDrainTest SignSeamWedgeDrainTest TransportCaptureGuardTest CardObjectOperationsTest -j4
          dbus-run-session -- ctest --test-dir build-tsan -R "$SUITES" --output-on-failure --no-tests=error
          # --no-tests=error fails only when the selection matches NOTHING, so the
          # denominator of a -R leg is the expression, not the build directory:
          # renaming or deleting a case the expression names still builds, still
          # runs, and covers less. The expected number is not written here: it
          # is what the same expression selects from ci/test-manifest.linux.txt,
          # the committed test set the gates step above has just held equal to
          # what the full build discovers. A case added to or dropped from one
          # of these suites moves both sides in the same change; a leg that
          # stops building or selecting one of them does not.
          want=$(grep -cE "$SUITES" ci/test-manifest.linux.txt || true)
          n=$(ctest --test-dir build-tsan -N -R "$SUITES" | grep -c '^ *Test *#' || true)
          echo "the sanitizer leg selected $n cases; the test manifest names $want for the same expression"
          test "$want" -gt 0 || { echo "the expression selects nothing from the manifest -- unmeasured"; exit 1; }
          test "$n" = "$want" || { echo "the sanitizer leg selected $n cases, not the $want the manifest names"; exit 1; }

      # --- PKCS#11 ownership -----------------------------------------------
      # Install rules cannot prove registration: the declaration once landed
      # exactly where the rule said and p11-kit never read it. The gate
      # therefore runs AFTER `cmake --install`, enumerates what the host
      # actually loads, and fails on a runner that installed nothing — which is
      # the state the previous check reported as success. Its self-test runs
      # with the others, in the shared gates of format-check.
      - name: Install to the system prefix and assert a single PKCS#11 owner
        working-directory: LibreLinux
        timeout-minutes: 5
        run: |
          cmake --install build
          ./e2e/check-p11kit-single-owner.sh

  packaging-build:
    # The path a distribution package takes: the agent core comes from a
    # package, not from a fetch. build-linux keeps the FetchContent path, which
    # is what proves the locked revision still resolves; this job proves the
    # packaging path declares every source it needs, and that the install
    # tree is exactly what packaging/payload/*.files claim when the build is
    # configured for one prefix and staged into another -- the shape in which
    # an install destination fixed at configure time lands outside every
    # package. A package build configures for /usr from the start and cannot
    # see that; this is why the job stays beside the package builds.
    #
    # The assertion is on the CONSEQUENCE, not on whether the environment
    # happens to have network: a populated _deps directory after configure
    # fails this job. A chroot that isolates the network would prove the same
    # thing by accident and stop proving it the day someone gives it one.
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: read
    env:
      LM_PREFIX: /opt/libremiddleware
      LA_PREFIX: /opt/libreagent
    steps:
      - name: Install system dependencies
        id: sys
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel cmake ninja git pkgconf \
            sdbus-cpp systemd-libs \
            openssl pcsclite opensc \
            gtest dbus \
            p11-kit \
            python-jsonschema \
            qt6-base kcoreaddons ki18n
          echo "toolchain=$(pacman -Q gcc glibc openssl pcsclite opensc systemd-libs p11-kit | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: LibreLinux
          persist-credentials: false

      - name: Checkout LibreMiddleware and LibreAgent at the lock
        id: deps
        uses: LibreSCRS/ci/actions/checkout-deps@5b9410f9b0e6ab6983c39f931e118e68007c12b4
        with:
          root: LibreLinux
          names: LibreMiddleware LibreAgent
          path: .
          fetch-depth: '0'
          submodules: recursive

      # The same key as build-linux: one install per locked commit and toolchain.
      - name: Restore the LibreMiddleware install
        id: lm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/libremiddleware
          key: lm-arch-${{ steps.deps.outputs.libremiddleware-sha }}-${{ steps.sys.outputs.toolchain }}

      - name: Build & install LibreMiddleware (Release, SHARED)
        if: steps.lm-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S LibreMiddleware -B lm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LM_PREFIX" \
            -DLIBREMIDDLEWARE_BUILD_SHARED=ON
          cmake --build lm-build -j4
          cmake --install lm-build

      - name: Keep the LibreMiddleware install
        if: steps.lm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/libremiddleware
          key: lm-arch-${{ steps.deps.outputs.libremiddleware-sha }}-${{ steps.sys.outputs.toolchain }}

      # Its own prefix, so the middleware install cached above stays exactly
      # what that key says it is.
      - name: Restore the LibreAgent core install
        id: la-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/libreagent
          key: la-arch-${{ steps.deps.outputs.libreagent-sha }}-${{ steps.deps.outputs.libremiddleware-sha }}-${{ steps.sys.outputs.toolchain }}

      - name: Build & install LibreAgent (Core) at the lock
        # The locked commit, not the agent's trunk: a package built from
        # whatever the agent happened to have on trunk that hour is the failure
        # this job exists to rule out. The components are the ones the agent's
        # own packages build and this repository's installed-package path asks
        # for (Core, Wire, Pkcs11Facade; TestSupport is on for a top-level
        # build), so the configure below meets the package a distribution
        # would have installed, not a smaller one.
        if: steps.la-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S LibreAgent -B la-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LA_PREFIX" \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX" \
            -DLIBREAGENT_BUILD_CORE=ON \
            -DLIBREAGENT_BUILD_WIRE=ON \
            -DLIBREAGENT_BUILD_PKCS11_FACADE=ON
          cmake --build la-build -j4
          cmake --install la-build

      - name: Keep the LibreAgent core install
        if: steps.la-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/libreagent
          key: la-arch-${{ steps.deps.outputs.libreagent-sha }}-${{ steps.deps.outputs.libremiddleware-sha }}-${{ steps.sys.outputs.toolchain }}

      - name: Configure the packaging way
        # A separate build directory on purpose: build/ belongs to build-linux
        # and its FetchContent path, and the two claims must not share a cache.
        # No CMAKE_INSTALL_PREFIX: the staged install below moves it to /usr,
        # and a destination fixed at configure time would not follow.
        working-directory: LibreLinux
        run: |
          cmake -B build-packaging -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$LM_PREFIX;$LA_PREFIX" \
            -DLIBRELINUX_USE_INSTALLED_AGENT_CORE=ON

      - name: The build declared every source it needs
        working-directory: LibreLinux
        run: |
          test ! -e build-packaging/_deps || {
            echo "::error::the build fetched a dependency; every source a package build needs must be declared"
            exit 1
          }

      - name: Build
        working-directory: LibreLinux
        run: cmake --build build-packaging -j4

      - name: Package payload matches the install manifest
        # Compares packaging/payload/*.files with a real staged install in both
        # directions. A pattern matching nothing is an error here too.
        working-directory: LibreLinux
        run: |
          DESTDIR="$PWD/_stage" cmake --install build-packaging --prefix /usr
          packaging/payload/check.sh "$PWD/_stage/usr"

  package:
    # Distribution packages, built in the target distribution's own container.
    #
    # Containers rather than apt/dnf on the runner: ubuntu-latest is one
    # distribution in one version and cannot produce a trixie or an fc43
    # package, and a container makes the same build reproducible with one
    # `docker run` on a development machine.
    #
    # Images are pinned by digest, not by tag. A tag moves under you; a digest
    # does not.
    name: package (${{ matrix.slug }})
    # Turn this on only after the agent component publishes .deb/.rpm assets AND
    # the download pattern below has moved from "*.$fam" to
    # "*.${{ matrix.slug }}.$fam". Until then the job fetches packages that are
    # not published: the download exits non-zero under `set -euo pipefail`, and
    # the gate reports the upstream packages missing. The switch looks like
    # "turn on when ready" and is really "turn on and watch it go red".
    if: vars.PACKAGE_JOB_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Measured locally at 30 minutes for the slowest image, times
    # about 2.5. A job with no limit does not fail when it hangs -- it burns
    # hours and hands back no log, because /logs answers 404 while it runs.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: debian13
            image: debian@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
          - slug: ubuntu2604
            image: ubuntu@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b
          - slug: fedora43
            image: fedora@sha256:a651ddf48ea28a06ed4e1e6519f51c9f47e7a5a138722ade87369b8fbb7e5b42
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out the working tree as the gate will read it
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Upstream packages come from their own published release. This job is
      # therefore enabled from the bottom up -- middleware first, then the
      # agent libraries, then the hosts -- because a job wired to a release
      # that does not exist yet is a job that has never run, and this project
      # has paid for one of those before. Set the repository variable
      # PACKAGE_JOB_ENABLED to true once the upstream release carries packages.
      - name: Fetch the upstream packages from their releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ matrix.slug }}" in fedora43) fam=rpm ;; *) fam=deb ;; esac
          ver=$(tr -d '[:space:]' < VERSION)
          mkdir -p "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreMiddleware/$fam"
          # The slug is part of the asset name upstream: Debian 13 and
          # Ubuntu 26.04 build .deb files with identical names, so the
          # publisher puts the distribution into the name and a consumer that
          # asked for "*.$fam" would fetch both and install packages built
          # against another distribution's glibc alongside its own.
          gh release download "$ver" --repo LibreSCRS/LibreMiddleware \
            --pattern "*.${{ matrix.slug }}.$fam" \
            --dir "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreMiddleware/$fam"
          mkdir -p "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreAgent/$fam"
          gh release download "$ver" --repo LibreSCRS/LibreAgent \
            --pattern "*.$fam" \
            --dir "$RUNNER_TEMP/librescrs-packages/out/${{ matrix.slug }}/LibreAgent/$fam"

      - name: Gate
        run: |
          # set +e first: the default shell here is `bash -eo pipefail`, so a
          # failing gate would end the step before its exit code could be read,
          # and the echo below would be dead text pretending to be a measurement.
          set +e
          bash packaging/ci/package-gate.sh "${{ matrix.image }}" "$RUNNER_TEMP/librescrs-packages/out"
          rc=$?
          set -e
          echo "PACKAGE_GATE_RC=$rc"
          test "$rc" = 0

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.slug }}
          path: ${{ runner.temp }}/librescrs-packages/out/${{ matrix.slug }}/**
          if-no-files-found: warn
