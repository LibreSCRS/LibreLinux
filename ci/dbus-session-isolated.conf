<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A session bus that activates nothing.

  The stock session configuration scans the standard service directories,
  including the compiled-in data directory, so a bus started after the agent
  has been installed on the host will start that agent on the first call to
  its name. The client-contract suites need the opposite: a bus on which the
  agent's name is simply absent until a test owns it. This configuration has
  no servicedir and no standard_session_servicedirs element, so a call to an
  unowned name is answered with ServiceUnknown and nothing is spawned.
-->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
    <allow user="*"/>
  </policy>
</busconfig>
