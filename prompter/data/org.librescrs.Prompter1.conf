<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  SPDX-License-Identifier: LGPL-2.1-or-later
  SPDX-FileCopyrightText: 2026 hirashix0

  Session-bus policy for org.librescrs.Prompter1 (the secure-input prompter).

  Defense-in-depth ONLY. This is a *session* bus, so every peer here already
  runs as the same local user; D-Bus policy cannot tell two same-user binaries
  apart. The authoritative trust gate is the binary-identity check inside the
  prompter (CallerAuthorizer: the caller's /proc/<pid>/exe must resolve to the
  librescrs-agent binary). This file simply scopes the interface to the
  session owner and denies the deprecated eavesdrop affordance, narrowing the
  attack surface a defective or malicious peer can reach.
-->
<busconfig>
  <policy context="default">
    <!-- The prompter may own its well-known name on the session bus. -->
    <allow own="org.librescrs.Prompter1"/>

    <!-- Same-user peers may address the prompter; the in-process
         CallerAuthorizer gate then rejects any caller that is not the
         agent binary. Scoped to the interface so unrelated method calls
         on the connection are not implicitly broadened. -->
    <allow send_destination="org.librescrs.Prompter1"
           send_interface="org.librescrs.Prompter1"/>

    <!-- Standard introspection / properties affordances kept explicit so a
         future tightening of the default policy does not silently break
         tooling like d-feet or busctl introspect. -->
    <allow send_destination="org.librescrs.Prompter1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.librescrs.Prompter1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.librescrs.Prompter1"
           send_interface="org.freedesktop.DBus.Peer"/>

    <!-- Deny the deprecated eavesdrop affordance outright: no peer may
         monitor traffic to/from the prompter (secret_fd hand-off). -->
    <deny eavesdrop="true"/>
    <deny send_destination="org.librescrs.Prompter1" eavesdrop="true"/>
    <deny receive_sender="org.librescrs.Prompter1" eavesdrop="true"/>
  </policy>
</busconfig>
