<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  SPDX-License-Identifier: LGPL-2.1-or-later
  SPDX-FileCopyrightText: 2026 hirashix0

  Session-bus policy for org.librescrs.Agent (the card-broker daemon).

  Defense-in-depth ONLY. This is a *session* bus, so every peer already runs as
  the same local user; D-Bus policy cannot tell two same-user binaries apart.
  The authoritative gates are INSIDE the agent: per-card capability checks, the
  polkit action for signing/config, and PIN-as-consent collected by the
  prompter. This file scopes the surface to the agent's own service and denies
  the deprecated eavesdrop affordance, narrowing what a defective or malicious
  same-user peer can reach (e.g. snooping a sealed-memfd hand-off in transit).
-->
<busconfig>
  <policy context="default">
    <!-- The agent may own its well-known name. -->
    <allow own="org.librescrs.Agent"/>

    <!-- Same-user peers may call the agent. The agent's internal gates
         (capability bit, polkit, PIN-as-consent) are the real authorization
         boundary; scoping here to the agent's destination keeps the policy
         robust across the agent's several interfaces (Manager1/Config1/
         Reader1/Card1/Operation1 + typed result sub-interfaces) without
         silently breaking a client when an interface is added. -->
    <allow send_destination="org.librescrs.Agent"/>

    <!-- No eavesdrop rules here, and that is deliberate.
         Measured on dbus 1.16, with the real packages installed:
           allow rules only ......................... method call reaches the service
           + deny receive_sender=... eavesdrop=true .. method call reaches the service
           + deny send_destination=... eavesdrop=true  AccessDenied, every call
           as previously shipped (both denies) ....... AccessDenied, every call
         A deny carrying eavesdrop="true" is not read as "only eavesdropping
         messages"; the send_destination form denied every method call to this
         service, so the daemon was unreachable by any client at all.
         Since dbus 1.9 eavesdropping is not something a peer can simply do:
         it requires BecomeMonitor on org.freedesktop.DBus.Monitoring, which
         these rules do not govern. So the construct bought nothing and cost
         everything. The authoritative gates are the ones named at the top of
         this file: the agent's own capability checks, the polkit action, and
         PIN-as-consent through the prompter.
    -->
  </policy>
</busconfig>
