# SPDX-License-Identifier: LGPL-2.1-or-later
name: Release

# LibreLinux distributes no prebuilt binaries of its own. The daemon, the
# prompter and the PKCS#11 module are compiled from the tag's sources by
# distribution packaging (packaging/{arch,debian,rpm}); the Arch recipe pulls
# the source tarball GitHub generates for the tag. There is therefore nothing
# for this workflow to upload and nothing to cosign — binary-artifact signing
# lives in the components that actually ship binaries. A release here needs
# exactly two things: proof that the tag carries the project signature, and
# curated notes taken from CHANGELOG.md.
#
# The workflow deliberately performs NO build. Besides keeping it cheap, that
# is what keeps tagging independent of the agent core: a source build resolves
# LibreAgent through cmake/FindOrUseLibreAgent.cmake, which follows the agent's
# trunk, so a build step here would make publishing this component depend on
# what the agent happens to have published at that moment. The publish order
# (agent first, this component after) is a property of the release sequence and
# is not something this workflow can assert — so it asserts nothing about it
# and never fetches the agent.

on:
  push:
    tags:
      # Same shape as the sibling components. The `v`-prefixed spelling is
      # accepted as well because packaging/arch/PKGBUILD fetches the tarball
      # from `refs/tags/v$pkgver`; cmake/GitVersion.cmake strips the prefix,
      # and so does the notes extraction below.
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Rehearsal path. A maintainer can start this workflow from the Actions tab
  # against an existing signed tag (Run workflow -> pick the tag as the ref) to
  # exercise the whole chain, release notes included, without pushing a fresh
  # tag. github.ref_name is the tag name on that path too, so every step below
  # behaves exactly as it does on a tag push; started against a branch instead,
  # the signature check fails closed, which is the intended outcome.
  workflow_dispatch:

# One run per tag at a time: a re-run racing a still-live earlier run would
# hand gh release create an already-existing release and fail at the last step.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-signature:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The release key's PRIMARY fingerprint, named once so the import check
      # and the signature check cannot pin different keys across a rotation.
      EXPECTED_FPR: '6B05889AC9A6A7188DF639B06F27A989C2031D16'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Import LibreSCRS release public key
        run: |
          # The published project key travels with the repository, as in the
          # sibling components. Report its absence in terms of what to do
          # about it rather than letting gpg fail with a bare open error.
          if [ ! -f KEYS ]; then
            echo "::error::KEYS is missing from the repository root — a release tag cannot be verified without the published LibreSCRS release public key"
            exit 1
          fi
          gpg --import KEYS
          gpg --list-keys --with-colons "$EXPECTED_FPR" | grep -q "^pub" \
            || { echo "::error::Public key import failed or fingerprint mismatch"; exit 1; }

      - name: Verify tag signature
        # verify-tag alone accepts a good signature by ANY key in the keyring,
        # so the signer is pinned by fingerprint through --raw's VALIDSIG line.
        #
        # Field order is the whole trick here. VALIDSIG's FIRST field is the
        # fingerprint of the key that physically signed, and this project signs
        # with a subkey (the primary is certify-only, `cSC`), so the first field
        # is the SUBKEY. The primary — the identity worth pinning, because it
        # outlives every subkey rotation — is VALIDSIG's LAST field. Matching
        # the primary right after "VALIDSIG" therefore rejects every genuinely
        # signed tag, and pinning the subkey instead would break at the next
        # rotation; match the primary in the trailing position.
        #
        # Anchored, and deliberately not a bare fingerprint grep: gpg also
        # emits KEY_CONSIDERED with the primary's fingerprint, and it does so
        # even for a BADSIG, so a loose match would accept a forged tag.
        #
        # The ref name moves through the environment, never inline into the
        # script — a git ref may carry shell metacharacters and the tag
        # filter's trailing * accepts an arbitrary suffix.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git verify-tag --raw "$TAG" 2>&1 \
            | grep -qE "^\[GNUPG:\] VALIDSIG [0-9A-F]{40} .* ${EXPECTED_FPR}\$" \
            || { echo "::error::Tag $TAG is not signed by the LibreSCRS release key"; exit 1; }

  release:
    needs: verify-signature
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Prepare release notes from CHANGELOG
        # Extract the section whose `## ` header contains the tag version
        # (matches `## [X.Y.Z]`, `## [X.Y.Z] — date`, or
        # `## [Unreleased] — X.Y.Z`). Fall back to auto-generated notes when the
        # CHANGELOG has no section for this tag so a release never ships empty
        # notes. --generate-notes and --notes-file are mutually exclusive, hence
        # the shell branch.
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" \
            '/^## / { if ($0 ~ ("(\\[|[[:space:]])" ver "(\\]|[[:space:]]|$)")) {f=1; next} else if (f) exit } f' \
            CHANGELOG.md > "$RUNNER_TEMP/relnotes.md"
          # A plain size test would accept a section that exists but holds only
          # blank lines, which publishes an empty release body; require at
          # least one non-whitespace byte before using the file.
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/relnotes.md"; then
            echo "NOTES_ARG=--notes-file $RUNNER_TEMP/relnotes.md" >> "$GITHUB_ENV"
          else
            echo "No CHANGELOG section for $VER — falling back to --generate-notes"
            echo "NOTES_ARG=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub release
        # The ref name and repository move through the environment, never
        # inline into the script — a git ref may carry shell metacharacters
        # and the tag filter's trailing * accepts an arbitrary suffix.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Mark X.Y.Z-{rc,beta,alpha,…} as pre-release; everything else stable.
          PRERELEASE_FLAG=""
          case "$TAG" in
              *-rc*|*-beta*|*-alpha*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          # NOTES_ARG must split into two argv entries and PRERELEASE_FLAG
          # must disappear when empty — deliberately unquoted.
          # shellcheck disable=SC2086
          gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --verify-tag \
              $NOTES_ARG \
              $PRERELEASE_FLAG
